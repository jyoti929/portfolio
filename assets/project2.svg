<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#p2Grad)" />

  <rect x="70" y="50" width="460" height="300" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
  <rect x="70" y="50" width="460" height="40" rx="12" fill="#1e293b" />
  <circle cx="95" cy="70" r="5" fill="#ef4444" />
  <circle cx="110" cy="70" r="5" fill="#f59e0b" />
  <circle cx="125" cy="70" r="5" fill="#10b981" />
  <text x="300" y="75" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">InAppCode - Interactive Mobile IDE</text>

  <!-- Code Editor Window Side -->
  <rect x="90" y="110" width="220" height="210" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="105" y="135" font-family="monospace" font-size="12" fill="#f43f5e">const <tspan fill="#38bdf8">solveChallenge</tspan> = () => {</text>
  <text x="120" y="158" font-family="monospace" font-size="12" fill="#94a3b8">// Run code in-app</text>
  <text x="120" y="181" font-family="monospace" font-size="12" fill="#f59e0b">return <tspan fill="#a855f7">"Test Passed 100%"</tspan>;</text>
  <text x="105" y="204" font-family="monospace" font-size="12" fill="#f43f5e">};</text>

  <!-- Console Output Side -->
  <rect x="330" y="110" width="180" height="210" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-dasharray="4,4" />
  <rect x="345" y="125" width="150" height="30" rx="6" fill="#10b981" opacity="0.8" />
  <text x="420" y="145" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">✓ Executed 0.4ms</text>
  <rect x="345" y="170" width="150" height="12" rx="3" fill="#94a3b8" opacity="0.6" />
  <rect x="345" y="192" width="120" height="12" rx="3" fill="#94a3b8" opacity="0.6" />
  <rect x="345" y="214" width="140" height="12" rx="3" fill="#94a3b8" opacity="0.6" />
</svg>
