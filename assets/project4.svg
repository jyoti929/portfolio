<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311b92" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#p4Grad)" />

  <!-- Mock Browser / App Frame -->
  <rect x="70" y="50" width="460" height="300" rx="12" fill="#0f172a" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
  <!-- Window Top Bar -->
  <rect x="70" y="50" width="460" height="40" rx="12" fill="#1e293b" />
  <circle cx="95" cy="70" r="5" fill="#ef4444" />
  <circle cx="110" cy="70" r="5" fill="#f59e0b" />
  <circle cx="125" cy="70" r="5" fill="#10b981" />
  <text x="300" y="75" font-family="sans-serif" font-weight="bold" font-size="13" fill="#e2e8f0" text-anchor="middle">Blogify — Modern Blogging Platform</text>

  <!-- Navigation / Category Tabs Bar -->
  <rect x="90" y="100" width="420" height="32" rx="6" fill="#1e293b" />
  <rect x="98" y="104" width="70" height="24" rx="4" fill="#a855f7" />
  <text x="133" y="120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">All Posts</text>
  <text x="210" y="120" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Technology</text>
  <text x="280" y="120" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Tutorials</text>
  <text x="350" y="120" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Lifestyle</text>
  <rect x="420" y="104" width="80" height="24" rx="4" fill="#ec4899" />
  <text x="460" y="120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+ Create</text>

  <!-- Featured Blog Post Card (Left) -->
  <rect x="90" y="145" width="240" height="185" rx="8" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1" />
  <rect x="102" y="157" width="216" height="85" rx="6" fill="#312e81" />
  <!-- Hero Graphic elements -->
  <circle cx="150" cy="195" r="24" fill="#818cf8" fill-opacity="0.5" />
  <rect x="190" y="180" width="100" height="8" rx="4" fill="#c084fc" />
  <rect x="190" y="195" width="70" height="6" rx="3" fill="#818cf8" />
  <!-- Article title & summary -->
  <text x="102" y="260" font-family="sans-serif" font-weight="bold" font-size="12" fill="#f8fafc">Fullstack App Architecture</text>
  <text x="102" y="278" font-family="sans-serif" font-size="10" fill="#cbd5e1">Explore Node.js, Express &amp; MongoDB...</text>
  <!-- Tags & Meta -->
  <rect x="102" y="294" width="55" height="18" rx="4" fill="#a855f7" fill-opacity="0.4" />
  <text x="129" y="306" font-family="sans-serif" font-size="9" fill="#e9d5ff" text-anchor="middle">Node.js</text>
  <rect x="163" y="294" width="60" height="18" rx="4" fill="#ec4899" fill-opacity="0.4" />
  <text x="193" y="306" font-family="sans-serif" font-size="9" fill="#fbcfe8" text-anchor="middle">MongoDB</text>
  <text x="295" y="306" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="end">5 min read</text>

  <!-- Article List Column (Right) -->
  <!-- Article item 1 -->
  <rect x="345" y="145" width="165" height="56" rx="6" fill="#1e293b" stroke="#334155" />
  <rect x="353" y="153" width="40" height="40" rx="4" fill="#ec4899" fill-opacity="0.8" />
  <text x="403" y="168" font-family="sans-serif" font-weight="bold" font-size="10" fill="#f1f5f9">Authentication Setup</text>
  <text x="403" y="183" font-family="sans-serif" font-size="9" fill="#94a3b8">User sessions &amp; Auth</text>

  <!-- Article item 2 -->
  <rect x="345" y="210" width="165" height="56" rx="6" fill="#1e293b" stroke="#334155" />
  <rect x="353" y="218" width="40" height="40" rx="4" fill="#8b5cf6" fill-opacity="0.8" />
  <text x="403" y="233" font-family="sans-serif" font-weight="bold" font-size="10" fill="#f1f5f9">RESTful API Design</text>
  <text x="403" y="248" font-family="sans-serif" font-size="9" fill="#94a3b8">CRUD Operations</text>

  <!-- Article item 3 -->
  <rect x="345" y="274" width="165" height="56" rx="6" fill="#1e293b" stroke="#334155" />
  <rect x="353" y="282" width="40" height="40" rx="4" fill="#06b6d4" fill-opacity="0.8" />
  <text x="403" y="297" font-family="sans-serif" font-weight="bold" font-size="10" fill="#f1f5f9">EJS Template Views</text>
  <text x="403" y="312" font-family="sans-serif" font-size="9" fill="#94a3b8">Dynamic UI Components</text>
</svg>
